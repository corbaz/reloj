<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flip Clock Countdown - Patrón de Módulo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="main-container">
    <section class="timer-card" aria-labelledby="card-title">
      <header class="header">
        <h1 id="card-title" class="title">Retro Flip Countdown</h1>

        <div class="clock-row">
          <div class="live-clock-pill" aria-label="Current International Time">
            <span class="live-dot" aria-hidden="true"></span>
            <span class="clock-label" id="clock-city-label">Buenos Aires:</span>
            <span id="current-gmt3-time" class="live-time-display">--:--:--</span>
            <span class="tz-tag" id="tz-tag-display">GMT-3</span>
          </div>
          <span id="sync-badge" class="badge badge-sync">Syncing UTC...</span>
        </div>

        <p class="subtitle">Authoritative International Time Sync (NTP) • Split-Flap 3D Clock</p>
      </header>

      <form id="timer-form" class="form-group" novalidate>
        <div class="tz-selector-row">
          <label for="timezone-select" class="input-label">City & Timezone</label>
          <div class="select-wrapper">
            <select id="timezone-select" class="tz-select" aria-label="Select City and Timezone">
              <option value="-12" data-label="Isla Baker">Isla Baker / AoE (GMT-12)</option>
              <option value="-11" data-label="Pago Pago">Pago Pago (GMT-11)</option>
              <option value="-10" data-label="Honolulu">Honolulu (GMT-10)</option>
              <option value="-9" data-label="Anchorage">Anchorage (GMT-9)</option>
              <option value="-8" data-label="Los Ángeles">Los Ángeles (GMT-8)</option>
              <option value="-7" data-label="Denver">Denver (GMT-7)</option>
              <option value="-6" data-label="Ciudad de México">Ciudad de México (GMT-6)</option>
              <option value="-5" data-label="Nueva York">Nueva York / Bogotá (GMT-5)</option>
              <option value="-4" data-label="Santiago">Santiago / Caracas (GMT-4)</option>
              <option value="-3" data-label="Buenos Aires" selected>Buenos Aires (GMT-3)</option>
              <option value="-2" data-label="Fernando de Noronha">Fernando de Noronha (GMT-2)</option>
              <option value="-1" data-label="Cabo Verde">Cabo Verde / Azores (GMT-1)</option>
              <option value="0" data-label="Londres">Londres / UTC (GMT+0)</option>
              <option value="1" data-label="Madrid">Madrid / París (GMT+1)</option>
              <option value="2" data-label="El Cairo">El Cairo / Atenas (GMT+2)</option>
              <option value="3" data-label="Moscú">Moscú / Estambul (GMT+3)</option>
              <option value="4" data-label="Dubái">Dubái (GMT+4)</option>
              <option value="5" data-label="Karachi">Karachi / Taskent (GMT+5)</option>
              <option value="6" data-label="Daca">Daca / Almaty (GMT+6)</option>
              <option value="7" data-label="Bangkok">Bangkok / Yakarta (GMT+7)</option>
              <option value="8" data-label="Singapur">Singapur / Pekín (GMT+8)</option>
              <option value="9" data-label="Tokio">Tokio / Seúl (GMT+9)</option>
              <option value="10" data-label="Sídney">Sídney / Melbourne (GMT+10)</option>
              <option value="11" data-label="Islas Salomón">Islas Salomón (GMT+11)</option>
              <option value="12" data-label="Auckland">Auckland / Fiyi (GMT+12)</option>
              <option value="13" data-label="Samoa">Samoa / Tonga (GMT+13)</option>
              <option value="14" data-label="Kiritimati">Kiritimati / Kiribati (GMT+14)</option>
            </select>
          </div>
        </div>

        <div class="label-row">
          <label for="target-datetime" id="target-label" class="input-label">Target Date & Time (Buenos Aires • GMT-3)</label>
        </div>
        <div class="input-row">
          <input
            type="datetime-local"
            id="target-datetime"
            name="target-datetime"
            class="datetime-input"
            required
            aria-describedby="status-msg"
          />
        </div>
      </form>

      <!-- Flip Clock Display -->
      <div class="flip-clock" aria-live="off" id="countdown-display">
        <div class="time-segment">
          <div class="flip-card" id="card-days" data-value="00">
            <div class="card-face top"><span class="digit-text">00</span></div>
            <div class="card-face bottom"><span class="digit-text">00</span></div>
          </div>
          <span class="time-label">Days</span>
        </div>

        <span class="colon">:</span>

        <div class="time-segment">
          <div class="flip-card" id="card-hours" data-value="00">
            <div class="card-face top"><span class="digit-text">00</span></div>
            <div class="card-face bottom"><span class="digit-text">00</span></div>
          </div>
          <span class="time-label">Hours</span>
        </div>

        <span class="colon">:</span>

        <div class="time-segment">
          <div class="flip-card" id="card-minutes" data-value="00">
            <div class="card-face top"><span class="digit-text">00</span></div>
            <div class="card-face bottom"><span class="digit-text">00</span></div>
          </div>
          <span class="time-label">Minutes</span>
        </div>

        <span class="colon">:</span>

        <div class="time-segment">
          <div class="flip-card" id="card-seconds" data-value="00">
            <div class="card-face top"><span class="digit-text">00</span></div>
            <div class="card-face bottom"><span class="digit-text">00</span></div>
          </div>
          <span class="time-label">Seconds</span>
        </div>
      </div>

      <!-- Action Controls -->
      <div class="button-row">
        <button type="button" id="start-btn" class="btn btn-primary">Start Countdown</button>
        <button type="button" id="stop-btn" class="btn btn-secondary" disabled>Stop</button>
      </div>

      <div class="version-row">
        <span class="version-tag">v.26.0920.09.57</span>
      </div>

      <!-- Status / Screen Reader Live Region -->
      <div id="status-msg" class="status-banner" role="status" aria-live="polite"></div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
