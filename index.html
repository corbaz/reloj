<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flip Clock Countdown - Patrón de Módulo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="main-container">
    <section class="timer-card" aria-labelledby="card-title">
      <header class="header">
        <h1 id="card-title" class="title">Retro Flip Countdown</h1>

        <div class="clock-row">
          <div class="live-clock-pill" aria-label="Current International Time">
            <span class="live-dot" aria-hidden="true"></span>
            <span class="clock-label" id="clock-city-label">Buenos Aires:</span>
            <span id="current-gmt3-time" class="live-time-display">--:--:--</span>
            <span class="tz-tag" id="tz-tag-display">GMT-3</span>
          </div>
          <span id="sync-badge" class="badge badge-sync">Syncing UTC...</span>
        </div>

        <p class="subtitle">Authoritative International Time Sync (NTP) • Split-Flap 3D Clock</p>
      </header>

      <form id="timer-form" class="form-group" novalidate>
        <div class="tz-selector-row">
          <label for="timezone-select" class="input-label">City & Timezone</label>
          <div class="select-wrapper">
            <select id="timezone-select" class="tz-select" aria-label="Select Country and Timezone">
              <option value="Etc/GMT+12" data-label="Isla Baker / AoE">Isla Baker / Isla Howland (AoE)</option>
              <option value="Pacific/Pago_Pago" data-label="Samoa Americana">Samoa Americana / Niue / Midway</option>
              <option value="Pacific/Honolulu" data-label="Hawái">EE. UU. (Hawái) / Polinesia Francesa / Islas Cook</option>
              <option value="America/Anchorage" data-label="Alaska">EE. UU. (Alaska) / Polinesia (Gambier)</option>
              <option value="America/Los_Angeles" data-label="Los Ángeles / Costa Oeste">EE. UU. (Costa Oeste) / Canadá / México (Baja California)</option>
              <option value="America/Denver" data-label="Denver / Montaña">EE. UU. (Montaña) / Canadá (Alberta) / México (Sonora)</option>
              <option value="America/Mexico_City" data-label="Ciudad de México">México / EE. UU. (Centro) / Costa Rica</option>
              <option value="America/New_York" data-label="Nueva York / Este">EE. UU. (Este) / Colombia / Perú</option>
              <option value="America/Santiago" data-label="Santiago de Chile">Chile / Venezuela / Bolivia</option>
              <option value="America/Argentina/Buenos_Aires" data-label="Buenos Aires" selected>Brasil / Argentina / Uruguay</option>
              <option value="America/Noronha" data-label="Fernando de Noronha">Brasil (Noronha) / Georgias del Sur</option>
              <option value="Atlantic/Cape_Verde" data-label="Cabo Verde">Cabo Verde / Portugal (Azores) / Groenlandia</option>
              <option value="Europe/London" data-label="Londres">Reino Unido / Portugal / Ghana</option>
              <option value="Europe/Madrid" data-label="Madrid">Alemania / Francia / España</option>
              <option value="Africa/Cairo" data-label="El Cairo">Egipto / Sudáfrica / Grecia</option>
              <option value="Europe/Moscow" data-label="Moscú">Rusia / Turquía / Arabia Saudita</option>
              <option value="Asia/Dubai" data-label="Dubái">Emiratos Árabes / Azerbaiyán / Georgia</option>
              <option value="Asia/Karachi" data-label="Karachi">Pakistán / Uzbekistán / Kazajistán</option>
              <option value="Asia/Dhaka" data-label="Daca">Bangladés / Kirguistán / Bután</option>
              <option value="Asia/Bangkok" data-label="Bangkok">Indonesia (Oeste) / Tailandia / Vietnam</option>
              <option value="Asia/Singapore" data-label="Singapur">China / Filipinas / Singapur</option>
              <option value="Asia/Tokyo" data-label="Tokio">Japón / Corea del Sur / Timor Oriental</option>
              <option value="Australia/Sydney" data-label="Sídney">Australia / Papúa Nueva Guinea / Micronesia</option>
              <option value="Pacific/Guadalcanal" data-label="Islas Salomón">Islas Salomón / Vanuatu / Nueva Caledonia</option>
              <option value="Pacific/Auckland" data-label="Auckland">Nueva Zelanda / Fiyi / Tuvalu</option>
              <option value="Pacific/Apia" data-label="Samoa">Samoa / Tonga / Kiribati (Fénix)</option>
              <option value="Pacific/Kiritimati" data-label="Kiritimati">Kiribati (Islas de la Línea)</option>
            </select>
          </div>
        </div>

        <div class="label-row">
          <label for="target-datetime" id="target-label" class="input-label">Target Date & Time (Buenos Aires • GMT-3)</label>
        </div>
        <div class="input-row">
          <input
            type="datetime-local"
            id="target-datetime"
            name="target-datetime"
            class="datetime-input"
            required
            aria-describedby="status-msg"
          />
        </div>
      </form>

      <!-- Flip Clock Display -->
      <div class="flip-clock" aria-live="off" id="countdown-display">
        <div class="time-segment">
          <div class="flip-card" id="card-days" data-value="00">
            <div class="card-face top"><span class="digit-text">00</span></div>
            <div class="card-face bottom"><span class="digit-text">00</span></div>
          </div>
          <span class="time-label">Days</span>
        </div>

        <span class="colon">:</span>

        <div class="time-segment">
          <div class="flip-card" id="card-hours" data-value="00">
            <div class="card-face top"><span class="digit-text">00</span></div>
            <div class="card-face bottom"><span class="digit-text">00</span></div>
          </div>
          <span class="time-label">Hours</span>
        </div>

        <span class="colon">:</span>

        <div class="time-segment">
          <div class="flip-card" id="card-minutes" data-value="00">
            <div class="card-face top"><span class="digit-text">00</span></div>
            <div class="card-face bottom"><span class="digit-text">00</span></div>
          </div>
          <span class="time-label">Minutes</span>
        </div>

        <span class="colon">:</span>

        <div class="time-segment">
          <div class="flip-card" id="card-seconds" data-value="00">
            <div class="card-face top"><span class="digit-text">00</span></div>
            <div class="card-face bottom"><span class="digit-text">00</span></div>
          </div>
          <span class="time-label">Seconds</span>
        </div>
      </div>

      <!-- Action Controls -->
      <div class="button-row">
        <button type="button" id="start-btn" class="btn btn-primary">Start Countdown</button>
        <button type="button" id="stop-btn" class="btn btn-secondary" disabled>Stop</button>
      </div>

      <div class="version-row">
        <span class="version-tag">v.26.0920.10.16</span>
      </div>

      <!-- Status / Screen Reader Live Region -->
      <div id="status-msg" class="status-banner" role="status" aria-live="polite"></div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
